[package]
name = "sweetsidle"
version = "0.1.0"
edition = "2024"
authors = ["Nauris Steins"]
license = "GPL-3.0-or-later"
repository = "https://github.com/naurissteins/sweetsidle"
description = "Recommended idle management daemon for the Sweets compositor"

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
kdl = { version = "6.5", default-features = false }
rustix = { version = "1.1", features = ["linux_5_1", "process"] }
signal-hook = { version = "0.4", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
