[package]
name = "sweetsidle"
version = "0.1.0"
edition = "2024"
authors = ["Nauris Steins"]
license = "GPL-3.0-or-later"
repository = "https://github.com/naurissteins/sweetsidle"
description = "Recommended idle management daemon for the Sweets compositor"

[dependencies]
async-channel = "2.5"
async-io = "2.6"
calloop = "0.14"
calloop-wayland-source = "0.4"
futures-lite = "2.6"
rustix = { version = "1.1", features = ["event", "linux_5_1", "process"] }
serde = { version = "1.0", features = ["derive"] }
signal-hook = { version = "0.4", default-features = false }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = "5.18"

[dev-dependencies]
tempfile = "3.27"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-server = "0.31"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
