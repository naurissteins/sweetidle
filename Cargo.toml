[workspace]
resolver = "2"
members = [
    "crates/sweetsidle-command",
    "crates/sweetsidle-config",
    "crates/sweetsidle-core",
    "crates/sweetsidle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nauris Steins"]
license = "GPL-3.0-or-later"
repository = "https://github.com/naurissteins/sweetsidle"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
kdl = { version = "6.5", default-features = false }
sweetsidle-command = { path = "crates/sweetsidle-command" }
sweetsidle-config = { path = "crates/sweetsidle-config" }
sweetsidle-core = { path = "crates/sweetsidle-core" }
