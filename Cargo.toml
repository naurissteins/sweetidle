[workspace]
resolver = "2"
members = [
    "crates/sweetsidle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nauris Steins"]
license = "GPL-3.0-or-later"
repository = "https://github.com/naurissteins/sweetsidle"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
